name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  e2e:
    name: E2E (service worker, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Headless Chromium/WebKit report Notification.permission as "denied"
      # (no notification UI), so notification-display tests self-skip there.
      # Running Chromium headed under xvfb gives us real banner coverage in CI;
      # Firefox honors the grant headless.
      - name: Run E2E tests
        run: |
          if [ "${{ matrix.browser }}" = "chromium" ]; then
            xvfb-run --auto-servernum npx playwright test --project=chromium --headed
          else
            npx playwright test --project=${{ matrix.browser }}
          fi

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
