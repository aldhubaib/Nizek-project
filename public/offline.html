<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e10" />
    <title>Nizek — Offline</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #0e0e10;
        color: #ededed;
        font-family: Inter, system-ui, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        padding: calc(1.5rem + env(safe-area-inset-top)) 1.25rem calc(1.5rem + env(safe-area-inset-bottom));
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.15rem;
        font-weight: 650;
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.875rem;
        line-height: 1.45;
        color: #a1a1aa;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.75rem;
        background: #4ade80;
        color: #052e16;
        font: inherit;
        font-weight: 700;
        font-size: 0.875rem;
        padding: 0.65rem 1.1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You&rsquo;re offline</h1>
      <p>Check your connection. Pages you already opened may still be available when you go back.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
