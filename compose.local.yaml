# Local Postgres, Redis, and Centrifugo.
# Start them with the rest of the stack: npm run local
# The Postgres user, password, and database come from DATABASE_URL in .env.

name: nizek-local

services:
  postgres:
    # postgres 17 matches the database already on this Mac (volume nizek-panel-pgdata).
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${PG_HOST_PORT}:5432"
    volumes:
      - nizek-panel-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"

  centrifugo:
    image: centrifugo/centrifugo:v6
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    ports:
      - "127.0.0.1:${CENTRIFUGO_HOST_PORT}:8000"
    environment:
      CENTRIFUGO_HTTP_SERVER_PORT: "8000"
      CENTRIFUGO_ENGINE_TYPE: memory
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: "http://localhost:3001 http://127.0.0.1:3001 http://localhost:3000"
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET_KEY}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY}
    restart: "no"

volumes:
  nizek-panel-pgdata:
    external: true
    name: nizek-panel-pgdata
