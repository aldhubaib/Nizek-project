[build]
dockerfilePath = "Dockerfile.worker"

[deploy]
startCommand = "./start-worker.sh"
# Horizontal scale: BullMQ supports multiple workers on the same queue.
# Each replica runs PUSH_WORKER_CONCURRENCY (default 25) concurrent jobs.
numReplicas = 2
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
