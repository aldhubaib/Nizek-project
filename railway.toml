[build]
buildCommand = "npm run build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public"

[deploy]
startCommand = "node prisma/ensure-tables.mjs && NODE_OPTIONS='--max-old-space-size=2048' node .next/standalone/server.js"
healthcheckPath = "/"
healthcheckTimeout = 300
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
